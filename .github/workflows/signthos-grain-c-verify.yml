name: Signthos Grain C Verification

on:
  push:
    branches:
      - main
    paths:
      - TARGET_SHA
      - .github/workflows/signthos-grain-c-verify.yml

permissions:
  contents: read

concurrency:
  group: signthos-grain-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout verification harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve exact Signthos target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(tr -d '[:space:]' < TARGET_SHA)"
          test "${#target}" -eq 40
          case "$target" in
            *[!0-9a-f]*) echo "TARGET_SHA must be a lowercase 40-hex commit" >&2; exit 2 ;;
          esac
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$target"

      - name: Install Rust 1.85.0
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Checkout exact Signthos commit
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/TheHalfMoon/Signthos.git signthos
          git -C signthos fetch --depth=1 origin "$TARGET_SHA"
          git -C signthos checkout --detach "$TARGET_SHA"
          actual="$(git -C signthos rev-parse HEAD)"
          echo "SIGNTHOS_HEAD=$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Resolve lockfile minimally and record graph
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo metadata --format-version 1 > /tmp/metadata.json
          cargo tree --locked > /tmp/tree.txt
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          before = tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())
          after = tomllib.loads(Path('Cargo.lock').read_text())
          before_by_name = {p['name']: p for p in before['package']}
          after_by_name = {p['name']: p for p in after['package']}
          for name in ('spdx', 'smallvec'):
              b = before_by_name[name]
              a = after_by_name[name]
              assert (a['version'], a.get('checksum')) == (b['version'], b.get('checksum')), (name, b, a)
          assert after_by_name['serde']['version'] == '1.0.219'
          assert after_by_name['serde_json']['version'] == '1.0.140'
          print('LOCK_PACKAGES')
          for package in sorted(after['package'], key=lambda p: (p['name'], p['version'])):
              print(package['name'], package['version'], package.get('checksum', '-'), package.get('source', '-'))
          PY

      - name: Apply candidate repairs and Rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          alignment = Path('signthos/tools/provenance/src/alignment.rs')
          text = alignment.read_text()
          old = '''            match license.get("classification").and_then(Value::as_str) {
                Some("spdx") => bounded_string(
                    path,
                    license,
                    "spdx",
                    &format!("{base}.license.spdx"),
                    1,
                    256,
                    report,
                ),
                _ => {}
            }
'''
          new = '''            if let Some("spdx") = license.get("classification").and_then(Value::as_str) {
                bounded_string(
                    path,
                    license,
                    "spdx",
                    &format!("{base}.license.spdx"),
                    1,
                    256,
                    report,
                );
            }
'''
          assert old in text
          alignment.write_text(text.replace(old, new, 1))

          validation = Path('signthos/tools/provenance/src/validation.rs')
          text = validation.read_text()
          text = text.replace(
              'use std::collections::HashSet;\n',
              'use std::collections::HashSet;\nuse std::fmt::Write as _;\n',
              1,
          )
          old = '''    pub fn render_text(&self) -> String {
        self.diagnostics
            .iter()
            .map(|diagnostic| {
                format!(
                    "{}: {} [{}]: {}\\n",
                    diagnostic.path, diagnostic.code, diagnostic.field, diagnostic.message
                )
            })
            .collect()
    }
'''
          new = '''    pub fn render_text(&self) -> String {
        let mut output = String::new();
        for diagnostic in &self.diagnostics {
            writeln!(
                output,
                "{}: {} [{}]: {}",
                diagnostic.path, diagnostic.code, diagnostic.field, diagnostic.message
            )
            .expect("writing to a String cannot fail");
        }
        output
    }
'''
          assert old in text
          validation.write_text(text.replace(old, new, 1))
          PY
          cd signthos/tools/provenance
          cargo fmt
          cargo fmt --check
          cd ../..
          git diff -- tools/provenance/src tools/provenance/tests > /tmp/candidate.patch

      - name: Clippy gate
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test gate
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo test --all-targets --all-features --locked
          cargo test --doc --locked
          cargo test --locked --offline

      - name: Assemble evidence
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/candidate/tools/provenance/src evidence/candidate/tools/provenance/tests
          printf 'target_sha=%s\n' "$TARGET_SHA" > evidence/environment.txt
          rustc --version >> evidence/environment.txt 2>&1 || true
          cargo --version >> evidence/environment.txt 2>&1 || true
          rustfmt --version >> evidence/environment.txt 2>&1 || true
          cargo clippy --version >> evidence/environment.txt 2>&1 || true
          if test -f signthos/tools/provenance/Cargo.lock; then cp signthos/tools/provenance/Cargo.lock evidence/Cargo.lock.generated; fi
          if test -f /tmp/metadata.json; then cp /tmp/metadata.json evidence/metadata.json; fi
          if test -f /tmp/tree.txt; then cp /tmp/tree.txt evidence/tree.txt; fi
          if test -f /tmp/candidate.patch; then cp /tmp/candidate.patch evidence/candidate.patch; fi
          cp signthos/tools/provenance/src/*.rs evidence/candidate/tools/provenance/src/ || true
          cp signthos/tools/provenance/tests/*.rs evidence/candidate/tools/provenance/tests/ || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signthos-grain-c-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
