name: Signthos Grain D Verification

on:
  push:
    branches:
      - main
    paths:
      - TARGET_GRAIN_D_SHA
      - .github/workflows/signthos-grain-d-verify.yml

permissions:
  contents: write

concurrency:
  group: signthos-grain-d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 74827276d37ff9ba3794d7da28818ae454762651
    steps:
      - name: Checkout verification harness
        id: harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve exact Signthos target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(tr -d '[:space:]' < TARGET_GRAIN_D_SHA)"
          test "${#target}" -eq 40
          case "$target" in
            *[!0-9a-f]*) echo "TARGET_GRAIN_D_SHA must be a lowercase 40-hex commit" >&2; exit 2 ;;
          esac
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$target"
          echo "BASE_SHA=$BASE_SHA"

      - name: Install Rust 1.85.0
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Checkout exact Signthos commit and canonical base
        id: signthos
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/TheHalfMoon/Signthos.git signthos
          git -C signthos fetch --depth=1 origin "$TARGET_SHA"
          git -C signthos fetch --depth=1 origin "$BASE_SHA"
          git -C signthos checkout --detach "$TARGET_SHA"
          actual="$(git -C signthos rev-parse HEAD)"
          echo "SIGNTHOS_HEAD=$actual"
          test "$actual" = "$TARGET_SHA"
          test "$(git -C signthos rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"

      - name: Exact Grain D change-surface proof
        id: surface
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git -C signthos diff --check "$BASE_SHA..$TARGET_SHA"
          git -C signthos diff --name-only "$BASE_SHA..$TARGET_SHA" | tee /tmp/changed-paths.txt
          python3 - <<'PY'
          from pathlib import Path

          paths = [line for line in Path('/tmp/changed-paths.txt').read_text().splitlines() if line]
          assert paths, 'Grain D change surface must not be empty'
          for path in paths:
              allowed = (
                  path.startswith('tools/provenance/')
                  or path.startswith('provenance/fixtures/')
                  or path == 'provenance/policy/license-policy.json'
                  or path.startswith('provenance/components/')
                  or path.startswith('specs/001-provenance-import-system/')
              )
              assert allowed, f'out-of-authority Grain D path: {path}'
              assert not path.startswith('.github/workflows/'), path
          print(f'CHANGE_SURFACE_OK={len(paths)}')
          PY

      - name: Resolve locked dependency graph
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          cargo tree --locked > /tmp/tree.txt
          cmp Cargo.lock /tmp/Cargo.lock.before
          echo '--- CARGO TREE ---'
          cat /tmp/tree.txt

      - name: Reconcile lockfile and component registry
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path('signthos')
          lock = tomllib.loads((root / 'tools/provenance/Cargo.lock').read_text())
          registry = json.loads((root / 'provenance/components/registry.json').read_text())
          metadata = json.loads(Path('/tmp/metadata.json').read_text())

          external = {
              (p['name'], p['version']): p
              for p in lock['package']
              if p.get('source', '').startswith('registry+')
          }
          components = {
              (c['name'], c['version']): c
              for c in registry['components']
              if c.get('ecosystem') == 'cargo'
          }
          assert set(components) == set(external), (set(external) - set(components), set(components) - set(external))

          metadata_external = {
              (p['name'], p['version'])
              for p in metadata['packages']
              if (p.get('source') or '').startswith('registry+')
          }
          assert metadata_external == set(external), (metadata_external, set(external))

          for key, package in sorted(external.items()):
              component = components[key]
              expected_id = f"cargo-{package['name']}-{package['version']}"
              assert component['id'] == expected_id, (component['id'], expected_id)
              assert component['package_checksum'] == package['checksum'], key
              assert component['source']['repository'].startswith('https://github.com/'), key
              assert re.fullmatch(r'[0-9a-f]{40}', component['source']['revision']), key
              assert component['license']['evidence'], key
              assert component['notice_requirement'] == 'pending', key
              assert component['distribution_review']['state'] == 'pending', key
              assert component['distribution_review']['evidence'] == [], key

          root_pkg = next(p for p in lock['package'] if p['name'] == 'signthos-provenance')
          assert sorted(root_pkg['dependencies']) == ['serde', 'serde_json', 'spdx']
          assert external[('serde', '1.0.219')]['checksum'] == '5f0e2c6ed6606019b4e29e69dbaba95b11854410e5347d525002456dbbb786b6'
          assert external[('serde_json', '1.0.140')]['checksum'] == '20068b6e96dc6c9bd23e01df8827e6c7e1f2fddd43c21810382803c136b99373'
          assert external[('spdx', '0.13.5')]['checksum'] == '081670c233dfbed55690cc0cd38424e0e24ac1b2673d0b408b3f7b684738dfa9'
          assert external[('smallvec', '1.15.1')]['checksum'] == '67b1b7a3b5fe4f1376887184045fcf45c69e92af734b7aaddc05fb777b6fbd03'
          print(f'COMPONENT_RECONCILIATION_OK={len(external)}')
          PY

      - name: Rustfmt exact-head gate
        id: fmt
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo fmt --check
          git diff --exit-code -- Cargo.toml Cargo.lock src tests

      - name: Strict Clippy exact-head gate
        id: clippy
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Focused Grain D tests
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo test --locked --test spdx_policy
          cargo test --locked --test fixtures
          cargo test --locked --test regressions
          cargo test --locked --test cli

      - name: Complete Cargo tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo test --all-targets --all-features --locked

      - name: Documentation tests
        id: doctests
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo test --doc --locked

      - name: Locked offline verification
        id: offline
        shell: bash
        run: |
          set -euo pipefail
          cd signthos/tools/provenance
          cargo test --locked --offline

      - name: Assemble evidence
        if: always()
        id: evidence
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'target_sha=%s\nbase_sha=%s\nharness_sha=%s\nrun_id=%s\n' \
            "$TARGET_SHA" "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" > evidence/environment.txt
          rustc --version >> evidence/environment.txt 2>&1 || true
          cargo --version >> evidence/environment.txt 2>&1 || true
          rustfmt --version >> evidence/environment.txt 2>&1 || true
          cargo clippy --version >> evidence/environment.txt 2>&1 || true
          cp /tmp/changed-paths.txt evidence/changed-paths.txt 2>/dev/null || true
          cp /tmp/metadata.json evidence/metadata.json 2>/dev/null || true
          cp /tmp/tree.txt evidence/tree.txt 2>/dev/null || true
          cp signthos/tools/provenance/Cargo.lock evidence/Cargo.lock.exact 2>/dev/null || true
          cp signthos/provenance/components/registry.json evidence/component-registry.exact.json 2>/dev/null || true
          cp signthos/provenance/policy/license-policy.json evidence/license-policy.exact.json 2>/dev/null || true

      - name: Upload exact-head evidence
        if: always()
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signthos-grain-d-exact-head-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Persist qualification result in Coddev
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          OUTCOME_TARGET: ${{ steps.target.outcome }}
          OUTCOME_RUST: ${{ steps.rust.outcome }}
          OUTCOME_SIGNTHOS: ${{ steps.signthos.outcome }}
          OUTCOME_SURFACE: ${{ steps.surface.outcome }}
          OUTCOME_LOCK: ${{ steps.lock.outcome }}
          OUTCOME_RECONCILE: ${{ steps.reconcile.outcome }}
          OUTCOME_FMT: ${{ steps.fmt.outcome }}
          OUTCOME_CLIPPY: ${{ steps.clippy.outcome }}
          OUTCOME_FOCUSED: ${{ steps.focused.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_DOCTESTS: ${{ steps.doctests.outcome }}
          OUTCOME_OFFLINE: ${{ steps.offline.outcome }}
          OUTCOME_EVIDENCE: ${{ steps.evidence.outcome }}
          OUTCOME_ARTIFACT: ${{ steps.artifact.outcome }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p verification
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = [
              'TARGET', 'RUST', 'SIGNTHOS', 'SURFACE', 'LOCK', 'RECONCILE', 'FMT',
              'CLIPPY', 'FOCUSED', 'TESTS', 'DOCTESTS', 'OFFLINE', 'EVIDENCE', 'ARTIFACT'
          ]
          outcomes = {name.lower(): os.environ[f'OUTCOME_{name}'] for name in names}
          required = ['target', 'rust', 'signthos', 'surface', 'lock', 'reconcile', 'fmt', 'clippy', 'focused', 'tests', 'doctests', 'offline']
          qualification = 'PASS' if all(outcomes[name] == 'success' for name in required) else 'FAIL'
          result = {
              'schema_version': 1,
              'kind': 'signthos_grain_d_exact_head_qualification',
              'qualification': qualification,
              'target_sha': os.environ['TARGET_SHA'],
              'base_sha': os.environ['BASE_SHA'],
              'harness_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'outcomes': outcomes,
          }
          Path('verification/signthos-grain-d-result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verification/signthos-grain-d-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record Signthos Grain D qualification result"
          git push origin HEAD:main
