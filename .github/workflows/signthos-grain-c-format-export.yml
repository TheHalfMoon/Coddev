name: Signthos Grain C Format Export

on:
  push:
    branches:
      - main
    paths:
      - FORMAT_TARGET_SHA

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(tr -d '[:space:]' < FORMAT_TARGET_SHA)"
          test "${#target}" -eq 40
          case "$target" in
            *[!0-9a-f]*) exit 2 ;;
          esac
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Install Rustfmt 1.85.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Format disposable exact-target checkout
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/TheHalfMoon/Signthos.git signthos
          git -C signthos fetch --depth=1 origin "$TARGET_SHA"
          git -C signthos checkout --detach "$TARGET_SHA"
          test "$(git -C signthos rev-parse HEAD)" = "$TARGET_SHA"
          cargo fmt --manifest-path signthos/tools/provenance/Cargo.toml --all
          mkdir -p formatted
          cp signthos/tools/provenance/src/lib.rs formatted/lib.rs
          cp signthos/tools/provenance/src/main.rs formatted/main.rs
          cp signthos/tools/provenance/src/component_review_alignment.rs formatted/component_review_alignment.rs
          git -C signthos diff -- tools/provenance/src/lib.rs tools/provenance/src/main.rs tools/provenance/src/component_review_alignment.rs > formatted/rustfmt.diff

      - name: Upload formatted candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signthos-grain-c-rustfmt-candidate
          path: formatted/
          if-no-files-found: error
          retention-days: 1
