name: Signthos Grain C Diagnostic Export

on:
  push:
    branches:
      - main
    paths:
      - FORMAT_TARGET_SHA

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(tr -d '[:space:]' < FORMAT_TARGET_SHA)"
          test "${#target}" -eq 40
          case "$target" in
            *[!0-9a-f]*) exit 2 ;;
          esac
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.85.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Run focused tests with retained output
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/TheHalfMoon/Signthos.git signthos
          git -C signthos fetch --depth=1 origin "$TARGET_SHA"
          git -C signthos checkout --detach "$TARGET_SHA"
          test "$(git -C signthos rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p diagnostic
          set +e
          (
            cd signthos/tools/provenance
            cargo test --locked --test fixtures
            rc1=$?
            cargo test --locked --test regressions
            rc2=$?
            cargo test --locked --test cli
            rc3=$?
            printf '\nFIXTURES_RC=%s\nREGRESSIONS_RC=%s\nCLI_RC=%s\n' "$rc1" "$rc2" "$rc3"
            exit $(( rc1 || rc2 || rc3 ))
          ) > diagnostic/focused-tests.txt 2>&1
          rc=$?
          echo "$rc" > diagnostic/exit-code.txt
          exit 0

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signthos-grain-c-focused-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
